<title>أثر — لوحة المشرف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Reem+Kufi:wght@600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --ink:#132422; --muted:#5C6E6B; --line:#D9E2E0;
  --accent:#0F8577; --accent-ink:#FFFFFF; --chip:#E3EDEB;
  --ok:#1E8A4F; --warn:#9A5B00; --bad:#B3362B;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:20px 16px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0}
h1{font-size:24px} h2{font-size:17px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:7px}
.btn:hover{filter:brightness(1.07)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
input[type=password],input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);min-height:1.4em;font-size:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
#map{height:340px;border-radius:12px;border:1px solid var(--line)}
.leaflet-popup-content{font-family:var(--f-body);text-align:right;direction:rtl}
.addRow{display:flex;gap:8px;flex-wrap:wrap}
.addRow input{flex:1;min-width:160px}
.linkBox{display:none;flex-direction:column;gap:8px;background:var(--chip);border-radius:10px;padding:14px;margin-top:10px}
.linkBox.show{display:flex}
.linkRow{display:flex;gap:8px;flex-wrap:wrap}
.linkRow .mono{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}
.pname{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.when{font-size:13px;color:var(--muted);white-space:nowrap}
.rowBtns{display:flex;gap:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:480px){.row{flex-wrap:wrap}.when{order:3;width:100%}}
</style>

<div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.1 7-12a7 7 0 1 0-14 0c0 4.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.6"/></svg><h1>أثر</h1></div>

  <section id="v-login" class="panel login" hidden>
    <h2>دخول المشرف</h2>
    <p class="muted">هذه اللوحة تعرض موقع كل شخص وافق على المشاركة.</p>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:14px">
      <div><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn" type="submit">دخول</button>
    </form>
  </section>

  <section id="v-dash" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="bar"><span class="muted" id="count">0 شخص</span><button class="btn ghost sm" id="logout" type="button">تسجيل الخروج</button></div>

    <div class="panel">
      <h2>إضافة شخص جديد</h2>
      <p class="muted" style="font-size:13px;margin-top:4px">يُنشأ رابط موافقة خاص به، ترسله له عبر واتساب. لن يُرسل أي موقع قبل أن يوافق هو بنفسه.</p>
      <div class="addRow" style="margin-top:12px">
        <input id="newName" type="text" placeholder="الاسم" maxlength="60">
        <button class="btn" id="addBtn" type="button">إنشاء رابط</button>
      </div>
      <div class="linkBox" id="linkBox">
        <div class="linkRow"><span class="mono" id="linkTxt"></span><button class="btn ghost sm" id="copyBtn" type="button">نسخ</button></div>
        <a class="btn sm" id="waBtn" href="#" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">إرسال عبر واتساب</a>
      </div>
    </div>

    <div class="panel" style="padding:12px">
      <div id="map"></div>
    </div>

    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
document.documentElement.lang='ar';document.documentElement.dir='rtl';
var $=function(s){return document.querySelector(s)};
var map=null,markers={},timer=null;

function show(id){['v-login','v-dash'].forEach(function(v){$('#'+v).hidden=(v!==id)})}
function ago(ms){if(!ms)return'';var s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<10)return'الآن';if(s<60)return'قبل '+s+' ث';if(s<3600)return'قبل '+Math.round(s/60)+' د';return'قبل '+Math.round(s/3600)+' س'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function ensureMap(){
  if(map)return;
  map=L.map('map').setView([24.7136,46.6753],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
}

function renderList(people){
  $('#count').textContent=people.length+' '+(people.length===1?'شخص':'أشخاص');
  $('#list').innerHTML=people.map(function(p){
    return '<div class="row"><span class="dot'+(p.online?' ok':'')+'"></span>'+
    '<span class="pname">'+esc(p.name)+'</span>'+
    '<span class="when">'+(p.sharing?(p.online?'يشارك الآن':'آخر تحديث '+ago(p.updatedAt*1000)):'لم يوافق بعد')+'</span>'+
    '<div class="rowBtns"><button class="btn ghost sm" data-wa="'+esc(p.token)+'" type="button">واتساب</button><button class="btn ghost sm" data-del="'+esc(p.token)+'" type="button">حذف</button></div></div>'
  }).join('')||'<div class="empty">ما فيه أشخاص بعد. أضف أول شخص من الأعلى.</div>';
}

function renderMap(people){
  ensureMap();
  var seen={},pts=[];
  people.forEach(function(p){
    if(p.lat==null)return;
    seen[p.token]=1;pts.push([p.lat,p.lng]);
    var html='<b>'+esc(p.name)+'</b><br>'+(p.online?'متصل الآن':'آخر ظهور '+ago(p.updatedAt*1000))+(p.acc?'<br>دقة ~'+Math.round(p.acc)+' م':'');
    if(markers[p.token]){markers[p.token].setLatLng([p.lat,p.lng]).setPopupContent(html);markers[p.token].setOpacity(p.online?1:.55)}
    else{markers[p.token]=L.marker([p.lat,p.lng],{opacity:p.online?1:.55}).addTo(map).bindPopup(html)}
  });
  Object.keys(markers).forEach(function(t){if(!seen[t]){map.removeLayer(markers[t]);delete markers[t]}});
  if(pts.length)map.fitBounds(pts,{maxZoom:14,padding:[30,30]});
}

function load(){
  fetch('/api/people',{credentials:'same-origin'}).then(function(r){
    if(r.status===401){stop();show('v-login');return}
    return r.json()
  }).then(function(j){if(j)
  {renderList(j.people);renderMap(j.people)}}).catch(function(){});
}
function stop(){if(timer){clearInterval(timer);timer=null}}

$('#loginForm').addEventListener('submit',function(e){e.preventDefault();$('#loginErr').textContent='';
  fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})})
   .then(function(r){if(r.ok){$('#pw').value='';show('v-dash');load();stop();timer=setInterval(load,6000)}
     else if(r.status===429){$('#loginErr').textContent='محاولات كثيرة. انتظر دقيقة.'}else{$('#loginErr').textContent='كلمة المرور غير صحيحة.'}})
   .catch(function(){$('#loginErr').textContent='تعذر الاتصال بالخادم.'})});
$('#logout').addEventListener('click',function(){stop();fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(function(){});show('v-login')});

$('#addBtn').addEventListener('click',function(){
  var name=$('#newName').value.trim();if(!name)return;
  fetch('/api/people',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
   .then(function(r){return r.json()}).then(function(j){
     if(!j.token)return;
     var link=location.origin+'/t/'+j.token;
     $('#linkTxt').textContent=link;
     $('#waBtn').href='https://wa.me/?text='+encodeURIComponent('مرحباً '+name+'، تفضّل رابط مشاركة الموقع: '+link);
     $('#linkBox').classList.add('show');
     $('#newName').value='';
     load();
   })});
$('#copyBtn').addEventListener('click',function(){
  var t=$('#linkTxt').textContent;
  (navigator.clipboard&&navigator.clipboard.writeText(t).catch(function(){}))||0});

$('#list').addEventListener('click',function(e){
  var del=e.target.closest('[data-del]'),wa=e.target.closest('[data-wa]');
  if(del){if(!window.confirm('حذف هذا الشخص؟'))return;fetch('/api/people/'+del.dataset.del,{method:'DELETE',credentials:'same-origin'}).then(load)}
  if(wa){var link=location.origin+'/t/'+wa.dataset.wa;window.open('https://wa.me/?text='+encodeURIComponent('تفضّل رابط مشاركة الموقع: '+link),'_blank')}
});

fetch('/api/people',{credentials:'same-origin'}).then(function(r){
  if(r.status===401){show('v-login');return}
  show('v-dash');load();timer=setInterval(load,6000);
}).catch(function(){show('v-login')});
})();
</script>
